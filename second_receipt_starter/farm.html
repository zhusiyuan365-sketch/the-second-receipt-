<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>My Virtual Farm — The Second Receipt</title><style>
:root{font-family:system-ui,-apple-system,Segoe UI,sans-serif;color:#24402b;background:#f5f8f1}*{box-sizing:border-box}body{margin:0}.wrap{max-width:600px;margin:20px auto;padding:16px}.card{background:#fff;padding:24px;border-radius:24px;box-shadow:0 8px 30px #163b1a12}h1{margin:0;font-size:26px}p{color:#617461}.field{padding:20px;background:linear-gradient(#dff0d4,#c5e0ad);border-radius:20px;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;min-height:240px}.plot{background:#a7774b;border:5px solid #8b603c;border-radius:16px;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:108px;color:white;font-size:12px;text-align:center}.plant{font-size:45px}.note{background:#f0f6ed;border-radius:12px;padding:12px;margin-top:18px}a{color:#326a46}
</style></head><body><main class="wrap"><div class="card"><h1>🌱 MY VIRTUAL FARM</h1><p>THE SECOND RECEIPT · Your scanned groceries</p><div id="field" class="field"></div><h2 id="summary"></h2><div class="note">These crops are waiting to grow. This prototype demonstrates the scanning-to-farm experience.</div><p><a href="index.html">Return to scanning station</a></p></div></main><script>
const crops={bok_choy:{name:'Bok Choy',emoji:'🥬'},carrot:{name:'Carrot',emoji:'🥕'},tomato:{name:'Tomato',emoji:'🍅'},potato:{name:'Potato',emoji:'🥔'}};const ids=(new URLSearchParams(location.search).get('crops')||'').split(',').filter(id=>Object.hasOwn(crops,id)).slice(0,30);const field=document.querySelector('#field');for(const id of ids){const plot=document.createElement('div');plot.className='plot';const emoji=document.createElement('span');emoji.className='plant';emoji.textContent=crops[id].emoji;const name=document.createElement('span');name.textContent=crops[id].name;plot.append(emoji,name);field.append(plot)}document.querySelector('#summary').textContent=ids.length?`${ids.length} scanned crop${ids.length===1?'':'s'}`:'No crops in this farm yet';if(!ids.length){const p=document.createElement('p');p.textContent='Scan some groceries first to grow your farm.';field.append(p)}
</script></body></html>

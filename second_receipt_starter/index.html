<!doctype html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>The Second Receipt — Scanner</title><style>
:root{font-family:system-ui,-apple-system,Segoe UI,sans-serif;color:#213a2c;background:#f5f8f1}*{box-sizing:border-box}body{margin:0}.wrap{max-width:740px;margin:36px auto;padding:20px}.panel{background:white;border-radius:24px;padding:28px;box-shadow:0 8px 30px #163b1a12}h1{margin:0 0 8px}p{color:#627364}label{display:block;margin:20px 0 8px;font-weight:600}input{width:100%;font-size:20px;padding:15px;border:2px solid #d3e0d0;border-radius:12px}button{border:0;border-radius:12px;padding:13px 18px;background:#326a46;color:white;font-weight:700;cursor:pointer;margin:8px 8px 0 0}button.secondary{background:#e5eee2;color:#284c32}button:disabled{opacity:.4;cursor:not-allowed}.chips{display:flex;gap:8px;flex-wrap:wrap}.chips button{font-size:14px}.basket{min-height:80px;background:#f3f7f0;padding:15px;border-radius:12px}li{margin:8px 0}.result{text-align:center;margin-top:25px;padding:22px;border:2px dashed #c7dbc7;border-radius:18px}.result img{width:220px;height:220px;max-width:100%}.muted{font-size:13px}.hidden{display:none}a{color:#24643a;overflow-wrap:anywhere}
</style></head><body><main class="wrap"><div class="panel"><h1>THE SECOND RECEIPT</h1><p>Scan your groceries to create a personalised virtual farm.</p><label for="barcode">Scan a barcode or type a product code</label><input id="barcode" placeholder="e.g. 10001" autocomplete="off" autofocus><div class="chips"><button type="button" data-code="10001">🥬 Bok Choy</button><button type="button" data-code="10002">🥕 Carrot</button><button type="button" data-code="10003">🍅 Tomato</button><button type="button" data-code="10004">🥔 Potato</button></div><h2>Your basket (<span id="count">0</span>)</h2><div class="basket"><ul id="basket"></ul><p id="empty">No products scanned yet.</p></div><button id="finish" disabled>Finish Scanning</button><button class="secondary" id="reset">Start New Basket</button><p id="message" role="status"></p><section id="result" class="result hidden"><h2>Your virtual farm is ready!</h2><p>Scan this QR code with your phone.</p><img id="qr" alt="QR code linking to your virtual farm"><p><a id="farmLink" target="_blank" rel="noopener">Open farm link</a></p><p class="muted">Your phone needs internet access. Publish these files online first.</p></section></div></main><script>
const catalog={"10001":{id:"bok_choy",name:"Bok Choy",emoji:"🥬"},"10002":{id:"carrot",name:"Carrot",emoji:"🥕"},"10003":{id:"tomato",name:"Tomato",emoji:"🍅"},"10004":{id:"potato",name:"Potato",emoji:"🥔"}};
const basket=[];const input=document.querySelector('#barcode');const message=document.querySelector('#message');
function render(){document.querySelector('#count').textContent=basket.length;document.querySelector('#basket').innerHTML='';for(const item of basket){const li=document.createElement('li');li.textContent=`${item.emoji} ${item.name}`;document.querySelector('#basket').append(li)}document.querySelector('#empty').hidden=basket.length>0;document.querySelector('#finish').disabled=basket.length===0;}
function add(code){const item=catalog[code.trim()];if(!item){message.textContent=`Unknown barcode: ${code}. Try 10001–10004.`;return}basket.push(item);message.textContent=`Added ${item.name}`;document.querySelector('#result').classList.add('hidden');render();}
input.addEventListener('keydown',event=>{if(event.key==='Enter'){event.preventDefault();add(input.value);input.value='';}});document.querySelectorAll('[data-code]').forEach(button=>button.addEventListener('click',()=>{add(button.dataset.code);input.focus()}));
document.querySelector('#finish').addEventListener('click',()=>{const ids=basket.map(p=>p.id).join(',');const url=new URL('farm.html',location.href);url.searchParams.set('crops',ids);const link=url.toString();document.querySelector('#farmLink').href=link;document.querySelector('#farmLink').textContent=link;/* QR image service: requires internet access */document.querySelector('#qr').src='https://api.qrserver.com/v1/create-qr-code/?size=300x300&data='+encodeURIComponent(link);document.querySelector('#result').classList.remove('hidden');message.textContent='Farm created. Scan the QR code!';});
document.querySelector('#reset').addEventListener('click',()=>{basket.length=0;document.querySelector('#result').classList.add('hidden');message.textContent='';render();input.focus()});render();
</script></body></html>
